version: '3.8'

services:
  # FastMCP Solution Service
  fastmcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: fastmcp-server
    restart: unless-stopped
    ports:
      - "${FASTMCP_PORT:-8030}:8030"
      - "${FASTMCP_SSE_PORT:-8031}:8031"
    environment:
      # Application configuration
      - HOST=0.0.0.0
      - PORT=8030
      - SSE_PORT=8031
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      
      # OpenProject configuration
      - OPENPROJECT_URL=${OPENPROJECT_URL:-http://openproject:8080}
      - OPENPROJECT_API_KEY=${OPENPROJECT_API_KEY}
      - OPENPROJECT_TIMEOUT=${OPENPROJECT_TIMEOUT:-30}
      - OPENPROJECT_MAX_RETRIES=${OPENPROJECT_MAX_RETRIES:-3}
      
      # FastMCP specific configuration
      - MAX_SESSIONS=${MAX_SESSIONS:-1000}
      - SESSION_TIMEOUT=${SESSION_TIMEOUT:-3600}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - METRICS_ENDPOINT=${METRICS_ENDPOINT:-/metrics}
      
      # Security configuration
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/app/src
      
      # Performance configuration
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-500}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-30}
      - MAX_REQUEST_SIZE=${MAX_REQUEST_SIZE:-10485760}
      
      # Monitoring configuration
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-30}
      - DEEP_HEALTH_CHECK_INTERVAL=${DEEP_HEALTH_CHECK_INTERVAL:-300}
      
    volumes:
      # Mount logs for persistence
      - fastmcp-logs:/app/logs
      # Mount data for caching and sessions
      - fastmcp-data:/app/data
      # Mount shared web assets if available
      - ../shared-web:/app/shared-web:ro
      # Mount custom templates if needed
      - ${TEMPLATES_DIR:-./templates}:/app/templates:ro
      
    networks:
      - mcp-network
      - openproject-network
      
    depends_on:
      - redis
      - openproject
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
      
    deploy:
      resources:
        limits:
          memory: 1Gi
          cpu: '1000m'
        reservations:
          memory: 512Mi
          cpu: '500m'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    
    # Security context
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,size=100M
      - /app/tmp:rw,size=100M

  # Redis for session management and caching
  redis:
    image: redis:7-alpine
    container_name: fastmcp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --appendfsync everysec
      --tcp-keepalive 300
      --timeout 0
      --tcp-backlog 511
    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf:ro
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # OpenProject Service (for development/testing)
  openproject:
    image: openproject/community:14
    container_name: openproject-server
    restart: unless-stopped
    ports:
      - "${OPENPROJECT_PORT:-8090}:8080"
    environment:
      # Database configuration
      - OPENPROJECT_DATABASE_ADAPTER=postgresql
      - OPENPROJECT_DATABASE_HOST=postgres
      - OPENPROJECT_DATABASE_PORT=5432
      - OPENPROJECT_DATABASE_NAME=${POSTGRES_DB:-openproject}
      - OPENPROJECT_DATABASE_USERNAME=${POSTGRES_USER:-openproject}
      - OPENPROJECT_DATABASE_PASSWORD=${POSTGRES_PASSWORD:-openproject_password}
      
      # Cache configuration
      - OPENPROJECT_CACHE_MEMCACHE_SERVER=memcached:11211
      - OPENPROJECT_RAILS_CACHE_STORE=memcache
      
      # Security configuration
      - OPENPROJECT_SECRET_KEY_BASE=${OPENPROJECT_SECRET_KEY_BASE:-$(openssl rand -hex 32)}
      
      # Email configuration (optional)
      - OPENPROJECT_EMAIL_DELIVERY_METHOD=${EMAIL_DELIVERY_METHOD:-smtp}
      - OPENPROJECT_SMTP_ADDRESS=${SMTP_ADDRESS:-localhost}
      - OPENPROJECT_SMTP_PORT=${SMTP_PORT:-587}
      
      # Host configuration
      - OPENPROJECT_HOST__NAME=${OPENPROJECT_HOST:-localhost:8090}
      - OPENPROJECT_HTTPS=false
    volumes:
      - openproject-pgdata:/var/openproject/pgdata
      - openproject-assets:/var/openproject/assets
    networks:
      - openproject-network
    depends_on:
      - postgres
      - memcached
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health_checks/default"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

  # PostgreSQL Database for OpenProject
  postgres:
    image: postgres:15-alpine
    container_name: openproject-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-openproject}
      - POSTGRES_USER=${POSTGRES_USER:-openproject}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-openproject_password}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - openproject-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openproject}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Memcached for OpenProject caching
  memcached:
    image: memcached:1.6-alpine
    container_name: openproject-memcached
    restart: unless-stopped
    command: memcached -m 256
    networks:
      - openproject-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "11211"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: fastmcp-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - mcp-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    profiles:
      - monitoring

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: fastmcp-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - mcp-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    profiles:
      - monitoring

  # Nginx reverse proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: fastmcp-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/ssl/certs:ro
      - nginx_logs:/var/log/nginx
    networks:
      - mcp-network
      - openproject-network
    depends_on:
      - fastmcp
      - openproject
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    profiles:
      - production

# Network configuration for service communication
networks:
  mcp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
  
  openproject-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16

# Volume configuration for data persistence
volumes:
  # FastMCP volumes
  fastmcp-logs:
    driver: local
  fastmcp-data:
    driver: local
  
  # Redis volume
  redis_data:
    driver: local
  
  # OpenProject volumes
  openproject-pgdata:
    driver: local
  openproject-assets:
    driver: local
  
  # Database volumes
  postgres-data:
    driver: local
  
  # Monitoring volumes
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_logs:
    driver: local

# Configuration for different deployment profiles
profiles:
  # Development profile with debugging enabled
  development:
    services:
      fastmcp:
        environment:
          - ENVIRONMENT=development
          - DEBUG=true
          - LOG_LEVEL=DEBUG
        volumes:
          - .:/app:rw  # Enable hot reload
        command: ["python", "-m", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8030", "--reload"]

  # Production profile with optimizations
  production:
    services:
      fastmcp:
        environment:
          - ENVIRONMENT=production
          - DEBUG=false
          - LOG_LEVEL=INFO
        read_only: true
        security_opt:
          - no-new-privileges:true

  # Testing profile for CI/CD
  testing:
    services:
      fastmcp:
        environment:
          - ENVIRONMENT=testing
          - DEBUG=false
          - LOG_LEVEL=WARNING
        ports:
          - "8030"  # Random port assignment
      openproject:
        profiles:
          - testing
      postgres:
        profiles:
          - testing
      memcached:
        profiles:
          - testing

  # Minimal profile for local development
  minimal:
    services:
      fastmcp:
        depends_on:
          - redis
        environment:
          - ENVIRONMENT=development
          - LOG_LEVEL=DEBUG
      redis:
        profiles:
          - minimal
    services:
      openproject:
        profiles:
          - minimal
      postgres:
        profiles:
          - minimal
      memcached:
        profiles:
          - minimal
      prometheus:
        profiles:
          - minimal
      grafana:
        profiles:
          - minimal
      nginx:
        profiles:
          - minimal