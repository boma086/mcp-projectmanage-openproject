# FastMCP Solution Kubernetes Configuration

# ConfigMap for FastMCP Solution
apiVersion: v1
kind: ConfigMap
metadata:
  name: fastmcp-solution-config
  namespace: mcp-openproject
data:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"
  REDIS_URL: "redis://redis-service:6379"
  PYTHONPATH: "/app/src"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  HOST: "0.0.0.0"
  PORT: "8030"
  SSE_PORT: "8031"
  
  # FastMCP specific configuration
  MAX_SESSIONS: "1000"
  SESSION_TIMEOUT: "3600"
  ENABLE_METRICS: "true"
  METRICS_ENDPOINT: "/metrics"
  MAX_CONCURRENT_REQUESTS: "500"
  REQUEST_TIMEOUT: "30"
  MAX_REQUEST_SIZE: "10485760"
  HEALTH_CHECK_INTERVAL: "30"
  DEEP_HEALTH_CHECK_INTERVAL: "300"
  
  # OpenProject configuration
  OPENPROJECT_TIMEOUT: "30"
  OPENPROJECT_MAX_RETRIES: "3"
  
  # Performance and security
  PYTHONHASHSEED: "random"
  PYTHONIOENCODING: "utf-8"
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
---
# Deployment for FastMCP Solution
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastmcp-solution
  namespace: mcp-openproject
  labels:
    app: fastmcp-solution
    version: v1
    component: mcp-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fastmcp-solution
  template:
    metadata:
      labels:
        app: fastmcp-solution
        version: v1
        component: mcp-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8030"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: fastmcp-solution
        image: mcp-fastmcp:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8030
          name: http
          protocol: TCP
        - containerPort: 8031
          name: sse
          protocol: TCP
        envFrom:
        - configMapRef:
            name: fastmcp-solution-config
        - secretRef:
            name: openproject-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8030
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8030
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: shared-web
          mountPath: /app/shared-web
          readOnly: true
        - name: tmp
          mountPath: /app/tmp
        - name: data
          mountPath: /app/data
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: logs
        emptyDir: {}
      - name: shared-web
        configMap:
          name: shared-web-assets
      - name: tmp
        emptyDir: {}
      - name: data
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
---
# Service for FastMCP Solution (HTTP)
apiVersion: v1
kind: Service
metadata:
  name: fastmcp-solution-service
  namespace: mcp-openproject
  labels:
    app: fastmcp-solution
    component: mcp-server
spec:
  selector:
    app: fastmcp-solution
  ports:
  - port: 80
    targetPort: 8030
    protocol: TCP
    name: http
  type: ClusterIP
---
# Service for FastMCP Solution (SSE)
apiVersion: v1
kind: Service
metadata:
  name: fastmcp-solution-sse-service
  namespace: mcp-openproject
  labels:
    app: fastmcp-solution
    component: mcp-server
spec:
  selector:
    app: fastmcp-solution
  ports:
  - port: 80
    targetPort: 8031
    protocol: TCP
    name: sse
  type: ClusterIP
---
# Horizontal Pod Autoscaler for FastMCP Solution
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fastmcp-solution-hpa
  namespace: mcp-openproject
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fastmcp-solution
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
# PodDisruptionBudget for FastMCP Solution
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fastmcp-solution-pdb
  namespace: mcp-openproject
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fastmcp-solution
---
# NetworkPolicy for FastMCP Solution
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fastmcp-solution-netpol
  namespace: mcp-openproject
spec:
  podSelector:
    matchLabels:
      app: fastmcp-solution
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: mcp-openproject
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8030
    - protocol: TCP
      port: 8031
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6379  # Redis
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 8080  # OpenProject
---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fastmcp-solution-monitor
  namespace: mcp-openproject
  labels:
    app: fastmcp-solution
    component: mcp-server
spec:
  selector:
    matchLabels:
      app: fastmcp-solution
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
    scheme: http
    honorLabels: true
    metricRelabelings:
    - sourceLabels: [__name__]
      regex: 'fastmcp_.*'
      action: keep
---
# PrometheusRule for FastMCP alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fastmcp-solution-alerts
  namespace: mcp-openproject
  labels:
    app: fastmcp-solution
    component: mcp-server
spec:
  groups:
  - name: fastmcp-solution
    interval: 30s
    rules:
    - alert: FastMCPHighErrorRate
      expr: rate(fastmcp_http_errors_total[5m]) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "FastMCP solution high error rate"
        description: "FastMCP solution has a high error rate of {{ $value }} errors per second"
    - alert: FastMCPLowAvailability
      expr: up{job="fastmcp-solution"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "FastMCP solution is down"
        description: "FastMCP solution instance {{ $labels.instance }} is down"
    - alert: FastMCPHighLatency
      expr: histogram_quantile(0.95, rate(fastmcp_request_duration_seconds_bucket[5m])) > 2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "FastMCP solution high latency"
        description: "FastMCP solution has high 95th percentile latency of {{ $value }} seconds"
    - alert: FastMCPHighMemoryUsage
      expr: container_memory_usage_bytes{container="fastmcp-solution"} / container_spec_memory_limit_bytes{container="fastmcp-solution"} > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "FastMCP solution high memory usage"
        description: "FastMCP solution is using {{ $value | humanizePercentage }} of memory limit"
    - alert: FastMCPHighCPUUsage
      expr: rate(container_cpu_usage_seconds_total{container="fastmcp-solution"}[5m]) / container_spec_cpu_quota{container="fastmcp-solution"} > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "FastMCP solution high CPU usage"
        description: "FastMCP solution is using {{ $value | humanizePercentage }} of CPU limit"