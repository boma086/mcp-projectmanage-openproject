# Prometheus configuration for FastMCP Solution
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'mcp-openproject-monitor'
    environment: '${ENVIRONMENT:-development}'

# Rule files for alerting
rule_files:
  - "alert_rules.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape configuration
scrape_configs:
  # FastMCP Solution metrics
  - job_name: 'fastmcp-solution'
    static_configs:
      - targets: ['fastmcp-solution:8030']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    scheme: http
    sample_limit: 10000
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'fastmcp-solution'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'fastmcp_.*'
        action: keep

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # Node exporter metrics (if available)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # OpenProject metrics (if available)
  - job_name: 'openproject'
    static_configs:
      - targets: ['openproject:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 15s
    scheme: http

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Container metrics (if cAdvisor is available)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Docker metrics (if available)
  - job_name: 'docker'
    static_configs:
      - targets: ['docker-exporter:9323']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s