# Secrets Configuration for MCP OpenProject Solutions

# OpenProject API Key Secret
apiVersion: v1
kind: Secret
metadata:
  name: openproject-secrets
  namespace: mcp-openproject
type: Opaque
data:
  # Replace with your actual base64-encoded OpenProject API key
  # echo -n "your-api-key-here" | base64
  OPENPROJECT_API_KEY: eW91ci1hcGkta2V5LWhlcmU=
  OPENPROJECT_URL: aHR0cHM6Ly95b3VyLW9wZW5wcm9qZWN0LmNvbQ==
---
# PostgreSQL Database Secret
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: mcp-openproject
type: Opaque
data:
  # Replace with your actual base64-encoded PostgreSQL password
  # echo -n "your-postgres-password" | base64
  POSTGRES_PASSWORD: eW91ci1wb3N0Z3Jlcy1wYXNzd29yZA==
---
# Grafana Admin Password Secret
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: mcp-openproject
type: Opaque
data:
  # Replace with your actual base64-encoded Grafana admin password
  # echo -n "your-grafana-password" | base64
  GF_SECURITY_ADMIN_PASSWORD: eW91ci1ncmFmYW5hLXBhc3N3b3Jk
---
# SSL/TLS Certificates Secret (placeholder - replace with actual certificates)
apiVersion: v1
kind: Secret
metadata:
  name: tls-secrets
  namespace: mcp-openproject
type: kubernetes.io/tls
data:
  # Replace with your actual base64-encoded TLS certificates
  # tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...
  # tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t...
---
# Generic Application Secrets
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: mcp-openproject
type: Opaque
data:
  # Application secret keys
  SECRET_KEY: eW91ci1hcHAtc2VjcmV0LWtleS1oZXJl
  JWT_SECRET_KEY: eW91ci1qd3Qtc2VjcmV0LWtleS1oZXJl
  REDIS_PASSWORD: eW91ci1yZWRpcy1wYXNzd29yZA==
  
  # External service credentials (if needed)
  DATABASE_SSL_ROOT_CERT: ""
  DATABASE_SSL_CLIENT_CERT: ""
  DATABASE_SSL_CLIENT_KEY: ""
  
  # Monitoring and alerting credentials
  ALERTMANAGER_URL: aHR0cDovL2FsZXJ0bWFuYWdlcjo5MDkz
  SLACK_WEBHOOK_URL: ""
  
  # Cloud provider credentials (if needed)
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  GCP_SERVICE_ACCOUNT_KEY: ""
  
  # Email configuration (if needed)
  SMTP_HOST: ""
  SMTP_PORT: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_USE_TLS: ""
---
# Environment-specific Secrets (Development)
apiVersion: v1
kind: Secret
metadata:
  name: dev-secrets
  namespace: mcp-openproject
type: Opaque
data:
  DEBUG_MODE: "dHJ1ZQ=="
  LOG_LEVEL: "REVCVUc="
  TESTING_MODE: "dHJ1ZQ=="
---
# Environment-specific Secrets (Production)
apiVersion: v1
kind: Secret
metadata:
  name: prod-secrets
  namespace: mcp-openproject
type: Opaque
data:
  DEBUG_MODE: "ZmFsc2U="
  LOG_LEVEL: "SU5GTw=="
  TESTING_MODE: "ZmFsc2U="
  ENABLE_METRICS: "dHJ1ZQ=="
  ENABLE_TRACING: "dHJ1ZQ=="
  SENTRY_DSN: ""
  
# Instructions for updating secrets:
#
# 1. Generate base64-encoded values:
#    echo -n "your-secret-value" | base64
#
# 2. Replace the placeholder values in this file
#
# 3. Apply the secrets to your cluster:
#    kubectl apply -f secrets.yaml
#
# 4. Never commit actual secret values to version control
#
# 5. Use proper secret management in production:
#    - HashiCorp Vault
#    - AWS Secrets Manager
#    - Azure Key Vault
#    - Google Cloud Secret Manager
#    - Sealed Secrets
#    - External Secrets Operator