# Security Hardening Configuration for Production

# Pod Security Policy
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: restricted-psp
  namespace: mcp-openproject
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
  readOnlyRootFilesystem: true

---
# Network Policy for Production Isolation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: production-network-policy
  namespace: mcp-openproject
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-system
      podSelector:
        matchLabels:
          app: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app: nginx
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 3000
    - protocol: UDP
      port: 53

---
# Resource Quotas for Production Namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: production-quota
  namespace: mcp-openproject
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "10"
    requests.storage: 500Gi
    count/deployments.apps: "20"
    count/replicasets.apps: "40"
    count/pods: "50"
    count/services: "20"
    count/secrets: "30"

---
# Limit Range for Production Pods
apiVersion: v1
kind: LimitRange
metadata:
  name: production-limits
  namespace: mcp-openproject
spec:
  limits:
  - default:
      cpu: "1000m"
      memory: "1Gi"
    defaultRequest:
      cpu: "500m"
      memory: "512Mi"
    max:
      cpu: "4000m"
      memory: "4Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
    type: Container

---
# Security Context Constraints
apiVersion: v1
kind: ConfigMap
metadata:
  name: security-context
  namespace: mcp-openproject
data:
  security-context.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: security-example
    spec:
      securityContext:
        fsGroup: 2000
        runAsUser: 1000
        runAsGroup: 3000
      containers:
      - name: secure-container
        image: nginx:alpine
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 3000
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE

---
# Secret Management with Automatic Rotation
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: mcp-openproject
  annotations:
    kubernetes.io/secret-rotation-period: "24h"
type: Opaque
data:
  # Base64 encoded credentials
  username: bWNwdXNlcg==  # mcpuser
  password: c2VjdXJlLXBhc3N3b3Jk  # secure-password

---
# Service Account with RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-service-account
  namespace: mcp-openproject
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/mcp-openproject-role"

---
# Cluster Role for Production Access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-production-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["extensions"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["monitoring.coreos.com"]
  resources: ["servicemonitors", "prometheusrules"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# Cluster Role Binding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-production-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-production-role
subjects:
- kind: ServiceAccount
  name: mcp-service-account
  namespace: mcp-openproject

---
# Pod Disruption Budget for High Availability
apiVersion: policy/v1beta1
kind: PodDisruptionBudget
metadata:
  name: http-solution-pdb
  namespace: mcp-openproject
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: http-solution

---
apiVersion: policy/v1beta1
kind: PodDisruptionBudget
metadata:
  name: fastapi-solution-pdb
  namespace: mcp-openproject
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: fastapi-solution

---
apiVersion: policy/v1beta1
kind: PodDisruptionBudget
metadata:
  name: fastmcp-solution-pdb
  namespace: mcp-openproject
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: fastmcp-solution

---
apiVersion: policy/v1beta1
kind: PodDisruptionBudget
metadata:
  name: typescript-solution-pdb
  namespace: mcp-openproject
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: typescript-solution

---
# Horizontal Pod Autoscalers for Production
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: http-solution-hpa
  namespace: mcp-openproject
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: http-solution
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fastapi-solution-hpa
  namespace: mcp-openproject
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fastapi-solution
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---
# Vertical Pod Autoscaler for Resource Optimization
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: redis-vpa
  namespace: mcp-openproject
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind:       "Deployment"
    name:       "redis"
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: "redis"
      minAllowed:
        cpu: "100m"
        memory: "128Mi"
      maxAllowed:
        cpu: "500m"
        memory: "512Mi"

---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: postgres-vpa
  namespace: mcp-openproject
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind:       "Deployment"
    name:       "postgres"
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: "postgres"
      minAllowed:
        cpu: "500m"
        memory: "1Gi"
      maxAllowed:
        cpu: "2000m"
        memory: "4Gi"

---
# Audit Logging Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-policy
  namespace: mcp-openproject
data:
  audit-policy.yaml: |
    apiVersion: audit.k8s.io/v1
    kind: Policy
    rules:
    - level: Metadata
      resources:
      - group: ""
        resources: ["pods", "services", "configmaps", "secrets"]
    - level: Request
      resources:
      - group: ""
        resources: ["pods/exec", "pods/portforward"]
    - level: RequestResponse
      resources:
      - group: ""
        resources: ["secrets"]
      namespaces: ["mcp-openproject"]

---
# Compliance Scanner Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: compliance-scanner
  namespace: mcp-openproject
data:
  scan-config.yaml: |
    checks:
    - name: "cis-kubernetes-benchmark"
      enabled: true
      severity: "high"
    - name: "nsa-kubernetes-hardening"
      enabled: true
      severity: "high"
    - name: "pod-security-standards"
      enabled: true
      severity: "medium"
    - name: "network-security"
      enabled: true
      severity: "medium"
    
    exclusions:
    - name: "test-pods"
      selector:
        matchLabels:
          environment: "test"
    
    reporting:
      format: "json"
      destination: "s3://mcp-openproject-compliance-reports/"
      schedule: "0 6 * * *"  # Daily at 6 AM