# Prometheus configuration for TypeScript Solution
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Rule files for alerting
rule_files:
  - "alert_rules.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # TypeScript Solution
  - job_name: 'typescript-solution'
    static_configs:
      - targets: ['mcp-typescript:8040']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    scheme: http
    
    # Relabel configurations
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'typescript-solution'
    
    # Metric relabeling for Node.js specific metrics
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'nodejs_.*'
        action: keep

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # OpenProject monitoring
  - job_name: 'openproject'
    static_configs:
      - targets: ['openproject:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 15s

  # Redis monitoring
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # PostgreSQL monitoring
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s