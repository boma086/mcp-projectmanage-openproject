version: '3.8'

services:
  # TypeScript MCP Solution Service
  mcp-typescript:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: mcp-typescript-server
    restart: unless-stopped
    ports:
      - "${TYPESCRIPT_PORT:-8040}:8040"
    environment:
      # Application configuration
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8040
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # OpenProject configuration
      - OPENPROJECT_URL=${OPENPROJECT_URL:-http://openproject:8080}
      - OPENPROJECT_API_KEY=${OPENPROJECT_API_KEY}
      
      # CORS configuration
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost,http://127.0.0.1}
      
      # Performance configuration
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-30000}
      - MAX_CONNECTIONS=${MAX_CONNECTIONS:-100}
      - CACHE_TTL=${CACHE_TTL:-300}
      
      # Node.js specific configuration
      - NODE_OPTIONS=--max-old-space-size=512
      - UV_THREADPOOL_SIZE=128
      
      # Security configuration
      - TRUST_PROXY=${TRUST_PROXY:-false}
    volumes:
      # Mount logs for persistence
      - mcp-typescript-logs:/app/logs
      # Mount data for caching
      - mcp-typescript-data:/app/data
      # Mount config for runtime configuration
      - ${CONFIG_DIR:-./config}:/app/config:ro
    networks:
      - mcp-network
    depends_on:
      - openproject
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8040/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # OpenProject Service (for development/testing)
  openproject:
    image: openproject/community:14
    container_name: openproject-server
    restart: unless-stopped
    ports:
      - "${OPENPROJECT_PORT:-8090}:8080"
    environment:
      # Database configuration
      - OPENPROJECT_DATABASE_ADAPTER=postgresql
      - OPENPROJECT_DATABASE_HOST=postgres
      - OPENPROJECT_DATABASE_PORT=5432
      - OPENPROJECT_DATABASE_NAME=${POSTGRES_DB:-openproject}
      - OPENPROJECT_DATABASE_USERNAME=${POSTGRES_USER:-openproject}
      - OPENPROJECT_DATABASE_PASSWORD=${POSTGRES_PASSWORD:-openproject_password}
      
      # Cache configuration
      - OPENPROJECT_CACHE_MEMCACHE_SERVER=memcached:11211
      - OPENPROJECT_RAILS_CACHE_STORE=memcache
      
      # Security configuration
      - OPENPROJECT_SECRET_KEY_BASE=${OPENPROJECT_SECRET_KEY_BASE:-$(openssl rand -hex 32)}
      
      # Email configuration (optional)
      - OPENPROJECT_EMAIL_DELIVERY_METHOD=${EMAIL_DELIVERY_METHOD:-smtp}
      - OPENPROJECT_SMTP_ADDRESS=${SMTP_ADDRESS:-localhost}
      - OPENPROJECT_SMTP_PORT=${SMTP_PORT:-587}
      
      # Host configuration
      - OPENPROJECT_HOST__NAME=${OPENPROJECT_HOST:-localhost:8090}
      - OPENPROJECT_HTTPS=false
    volumes:
      - openproject-pgdata:/var/openproject/pgdata
      - openproject-assets:/var/openproject/assets
    networks:
      - mcp-network
    depends_on:
      - postgres
      - memcached
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health_checks/default"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: openproject-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-openproject}
      - POSTGRES_USER=${POSTGRES_USER:-openproject}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-openproject_password}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openproject}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Memcached for caching
  memcached:
    image: memcached:1.6-alpine
    container_name: openproject-memcached
    restart: unless-stopped
    command: memcached -m 256
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "11211"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Redis for TypeScript caching (optional)
  redis:
    image: redis:7-alpine
    container_name: mcp-typescript-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles:
      - redis

  # Prometheus for monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: mcp-typescript-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - mcp-network
    profiles:
      - monitoring

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: mcp-typescript-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - mcp-network
    depends_on:
      - prometheus
    profiles:
      - monitoring

  # Nginx reverse proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: mcp-typescript-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - mcp-network
    depends_on:
      - mcp-typescript
      - openproject
    profiles:
      - production
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  # Application volumes
  mcp-typescript-logs:
    driver: local
  mcp-typescript-data:
    driver: local
  
  # OpenProject volumes
  openproject-pgdata:
    driver: local
  openproject-assets:
    driver: local
  
  # Database volumes
  postgres-data:
    driver: local
  
  # Redis volume
  redis-data:
    driver: local
  
  # Monitoring volumes
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  mcp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16