# TypeScript Solution Kubernetes Configuration

# ConfigMap for TypeScript Solution
apiVersion: v1
kind: ConfigMap
metadata:
  name: typescript-solution-config
  namespace: mcp-openproject
data:
  # Application configuration
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"
  HOST: "0.0.0.0"
  PORT: "8040"
  
  # Node.js specific configuration
  NODE_OPTIONS: "--max-old-space-size=512"
  UV_THREADPOOL_SIZE: "128"
  
  # CORS configuration
  CORS_ALLOW_ORIGINS: "http://localhost,http://127.0.0.1"
  
  # Performance configuration
  REQUEST_TIMEOUT: "30000"
  MAX_CONNECTIONS: "100"
  CACHE_TTL: "300"
  
  # Security configuration
  TRUST_PROXY: "false"
  
  # External service URLs
  REDIS_URL: "redis://redis-service:6379"
  OPENPROJECT_URL: "http://openproject-service:8080"
---
# Deployment for TypeScript Solution
apiVersion: apps/v1
kind: Deployment
metadata:
  name: typescript-solution
  namespace: mcp-openproject
  labels:
    app: typescript-solution
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: typescript-solution
  template:
    metadata:
      labels:
        app: typescript-solution
        version: v1
    spec:
      containers:
      - name: typescript-solution
        image: mcp-typescript:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8040
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: typescript-solution-config
        - secretRef:
            name: openproject-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8040
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8040
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: shared-web
          mountPath: /app/shared-web
          readOnly: true
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: logs
        emptyDir: {}
      - name: shared-web
        configMap:
          name: shared-web-assets
      - name: config
        configMap:
          name: typescript-solution-config
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
---
# Service for TypeScript Solution
apiVersion: v1
kind: Service
metadata:
  name: typescript-solution-service
  namespace: mcp-openproject
  labels:
    app: typescript-solution
spec:
  selector:
    app: typescript-solution
  ports:
  - port: 80
    targetPort: 8040
    protocol: TCP
    name: http
  type: ClusterIP
---
# Horizontal Pod Autoscaler for TypeScript Solution
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: typescript-solution-hpa
  namespace: mcp-openproject
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: typescript-solution
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
# Pod Disruption Budget for TypeScript Solution
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: typescript-solution-pdb
  namespace: mcp-openproject
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: typescript-solution
---
# Service Monitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: typescript-solution-monitor
  namespace: mcp-openproject
  labels:
    app: typescript-solution
spec:
  selector:
    matchLabels:
      app: typescript-solution
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    timeout: 10s
    scheme: http
---
# Network Policy for TypeScript Solution
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: typescript-solution-network-policy
  namespace: mcp-openproject
spec:
  podSelector:
    matchLabels:
      app: typescript-solution
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: mcp-openproject
    ports:
    - protocol: TCP
      port: 8040
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: mcp-openproject
  - to: []
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6379 # Redis
    - protocol: TCP
      port: 5432 # PostgreSQL