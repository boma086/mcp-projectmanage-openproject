name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      solution:
        required: true
        type: string
        description: 'Solution name (solution-http, solution-fastapi, solution-fastmcp, solution-typescript)'
      python-version:
        required: false
        type: string
        default: '3.11'
        description: 'Python version for Python solutions'
      node-version:
        required: false
        type: string
        default: '18'
        description: 'Node.js version for TypeScript solution'
      cache-key:
        required: false
        type: string
        default: ''
        description: 'Custom cache key suffix'

    outputs:
      build-successful:
        description: 'Build success status'
        value: ${{ jobs.build.outputs.build-successful }}
      artifacts-uploaded:
        description: 'Artifacts uploaded status'
        value: ${{ jobs.build.outputs.artifacts-uploaded }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-successful: ${{ steps.build-check.outputs.success }}
      artifacts-uploaded: ${{ steps.upload.outputs.uploaded }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup solution info
      id: setup
      run: |
        SOLUTION="${{ inputs.solution }}"
        echo "solution=${SOLUTION}" >> $GITHUB_OUTPUT
        
        # Determine if this is a Python or TypeScript solution
        if [[ "${SOLUTION}" == "solution-typescript" ]]; then
          echo "solution-type=typescript" >> $GITHUB_OUTPUT
          echo "runtime=node" >> $GITHUB_OUTPUT
        else
          echo "solution-type=python" >> $GITHUB_OUTPUT
          echo "runtime=python" >> $GITHUB_OUTPUT
        fi

    - name: Set up Python ${{ inputs.python-version }}
      if: steps.setup.outputs.solution-type == 'python'
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup Node.js ${{ inputs.node-version }}
      if: steps.setup.outputs.solution-type == 'typescript'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ inputs.solution }}/package.json

    - name: Cache Python dependencies
      if: steps.setup.outputs.solution-type == 'python'
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ inputs.solution }}${{ inputs.cache-key }}-${{ hashFiles(format('{0}/requirements.txt', inputs.solution)) }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ inputs.solution }}${{ inputs.cache-key }}-
          ${{ runner.os }}-pip-${{ inputs.solution }}-
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      if: steps.setup.outputs.solution-type == 'python'
      run: |
        cd ${{ inputs.solution }}
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install mcp-core for Python solutions
        if [[ "${{ inputs.solution }}" != "solution-typescript" ]]; then
          cd ../mcp-core && pip install -e . && cd ..
        fi

    - name: Install Node.js dependencies
      if: steps.setup.outputs.solution-type == 'typescript'
      run: |
        cd ${{ inputs.solution }}
        npm ci

    - name: Build TypeScript solution
      if: steps.setup.outputs.solution-type == 'typescript'
      run: |
        cd ${{ inputs.solution }}
        npm run build || echo "Build script not found, skipping..."

    - name: Run code quality checks
      id: quality-check
      run: |
        cd ${{ inputs.solution }}
        
        if [[ "${{ steps.setup.outputs.solution-type }}" == "python" ]]; then
          # Python quality checks
          python -m ruff check src/ || echo "Ruff not available, skipping..."
          python -m black --check src/ || echo "Black not available, skipping..."
          python -m isort --check-only src/ || echo "isort not available, skipping..."
        else
          # TypeScript quality checks
          npm run lint || echo "Lint script not found, skipping..."
        fi
        
        echo "quality-passed=true" >> $GITHUB_OUTPUT

    - name: Build artifacts
      id: build-artifacts
      run: |
        cd ${{ inputs.solution }}
        
        # Create build directory
        mkdir -p build/dist
        
        # Copy necessary files
        if [[ "${{ steps.setup.outputs.solution-type }}" == "python" ]]; then
          cp -r src/ build/dist/
          cp requirements.txt build/dist/
          if [[ -f "Dockerfile" ]]; then
            cp Dockerfile build/dist/
          fi
        else
          cp -r dist/ build/dist/ 2>/dev/null || true
          cp -r build/ build/dist/ 2>/dev/null || true
        fi
        
        # Create build info
        cat > build/build-info.json << EOF
        {
          "solution": "${{ inputs.solution }}",
          "type": "${{ steps.setup.outputs.solution-type }}",
          "runtime": "${{ steps.setup.outputs.runtime }}",
          "build_time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "commit": "${{ github.sha }}",
          "branch": "${{ github.ref_name }}"
        }
        EOF

    - name: Upload build artifacts
      id: upload
      uses: actions/upload-artifact@v3
      with:
        name: ${{ inputs.solution }}-build-${{ github.run_number }}
        path: |
          ${{ inputs.solution }}/build/
          ${{ inputs.solution }}/dist/
        retention-days: 7

    - name: Mark build successful
      id: build-check
      run: |
        echo "success=true" >> $GITHUB_OUTPUT

    - name: Build summary
      run: |
        echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
        echo "- **Solution**: ${{ inputs.solution }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Type**: ${{ steps.setup.outputs.solution-type }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Runtime**: ${{ steps.setup.outputs.runtime }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Quality Checks**: ${{ steps.quality-check.outputs.quality-passed }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Time**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY