name: Reusable Security Scan Workflow

on:
  workflow_call:
    inputs:
      solution:
        required: true
        type: string
        description: 'Solution name to scan'
      scan-type:
        required: false
        type: string
        default: 'all'
        description: 'Scan type (code, dependencies, container, all)'
      fail-on-critical:
        required: false
        type: boolean
        default: true
        description: 'Fail workflow on critical vulnerabilities'

    outputs:
      security-scan-passed:
        description: 'Security scan passed status'
        value: ${{ jobs.security.outputs.scan-passed }}
      critical-vulnerabilities:
        description: 'Number of critical vulnerabilities found'
        value: ${{ jobs.security.outputs.critical-count }}
      high-vulnerabilities:
        description: 'Number of high vulnerabilities found'
        value: ${{ jobs.security.outputs.high-count }}
      scan-report:
        description: 'Security scan report location'
        value: ${{ jobs.security.outputs.scan-report }}

jobs:
  security:
    runs-on: ubuntu-latest
    outputs:
      scan-passed: ${{ steps.results.outputs.scan-passed }}
      critical-count: ${{ steps.results.outputs.critical-count }}
      high-count: ${{ steps.results.outputs.high-count }}
      scan-report: ${{ steps.report.outputs.location }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup directories
      run: |
        mkdir -p security-reports
        echo "solution=${{ inputs.solution }}" >> $GITHUB_OUTPUT

    - name: Run Trivy filesystem scan
      id: trivy-fs
      if: inputs.scan-type == 'all' || inputs.scan-type == 'code'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '${{ inputs.solution }}'
        format: 'sarif'
        output: 'security-reports/trivy-fs.sarif'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'

    - name: Run Trivy dependency scan
      id: trivy-deps
      if: inputs.scan-type == 'all' || inputs.scan-type == 'dependencies'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '${{ inputs.solution }}'
        format: 'json'
        output: 'security-reports/trivy-deps.json'
        exit-code: '0'
        severity: 'CRITICAL,HIGH,MEDIUM'
        vulnerability-types: 'os,library'

    - name: Run CodeQL analysis
      id: codeql
      if: inputs.scan-type == 'all' || inputs.scan-type == 'code'
      uses: github/codeql-action/init@v2
      with:
        languages: python,javascript

    - name: Perform CodeQL Analysis
      if: inputs.scan-type == 'all' || inputs.scan-type == 'code'
      uses: github/codeql-action/analyze@v2
      with:
        output: 'security-reports/codeql-results'

    - name: Run Gitleaks secret scan
      id: gitleaks
      if: inputs.scan-type == 'all' || inputs.scan-type == 'code'
      uses: gitleaks/gitleaks-action@v2
      with:
        path: '${{ inputs.solution }}'
        report-path: 'security-reports/gitleaks-report.json'
        exit-code: '0'

    - name: Run Bandit security scan for Python
      id: bandit
      if: (inputs.scan-type == 'all' || inputs.scan-type == 'code') && inputs.solution != 'solution-typescript'
      run: |
        cd ${{ inputs.solution }}
        
        # Install bandit if not available
        pip install bandit[toml] || pip install bandit
        
        # Run bandit scan
        if [ -d "src" ]; then
          bandit -r src/ -f json -o ../security-reports/bandit-report.json || \
          bandit -r . -f json -o ../security-reports/bandit-report.json
        fi

    - name: Run npm audit for TypeScript
      id: npm-audit
      if: (inputs.scan-type == 'all' || inputs.scan-type == 'dependencies') && inputs.solution == 'solution-typescript'
      run: |
        cd ${{ inputs.solution }}
        
        # Run npm audit
        npm audit --json > ../security-reports/npm-audit.json || echo "npm audit completed with issues"

    - name: Parse security results
      id: results
      run: |
        cd security-reports
        
        CRITICAL_COUNT=0
        HIGH_COUNT=0
        SCAN_PASSED=true
        
        # Parse Trivy results
        if [ -f "trivy-deps.json" ]; then
          echo "Parsing Trivy dependency scan results..."
          python3 << 'EOF'
          import json
          try:
              with open('trivy-deps.json', 'r') as f:
                  data = json.load(f)
              
              critical = 0
              high = 0
              
              if 'Results' in data:
                  for result in data['Results']:
                      if 'Vulnerabilities' in result:
                          for vuln in result['Vulnerabilities']:
                              severity = vuln.get('Severity', 'UNKNOWN')
                              if severity == 'CRITICAL':
                                  critical += 1
                              elif severity == 'HIGH':
                                  high += 1
              
              print(f"CRITICAL={critical}")
              print(f"HIGH={high}")
              
              with open('trivy-summary.txt', 'w') as f:
                  f.write(f"CRITICAL: {critical}\n")
                  f.write(f"HIGH: {high}\n")
                  
          except Exception as e:
              print(f"Error parsing Trivy results: {e}")
              print("CRITICAL=0")
              print("HIGH=0")
          EOF
        fi
        
        # Parse Bandit results
        if [ -f "bandit-report.json" ]; then
          echo "Parsing Bandit results..."
          python3 << 'EOF'
          import json
          try:
              with open('bandit-report.json', 'r') as f:
                  data = json.load(f)
              
              critical = 0
              high = 0
              
              if 'results' in data:
                  for result in data['results']:
                      severity = result.get('issue_severity', 'MEDIUM')
                      if severity == 'HIGH':
                          high += 1
                      elif severity == 'CRITICAL':
                          critical += 1
              
              print(f"BANDIT_CRITICAL={critical}")
              print(f"BANDIT_HIGH={high}")
              
          except Exception as e:
              print(f"Error parsing Bandit results: {e}")
              print("BANDIT_CRITICAL=0")
              print("BANDIT_HIGH=0")
          EOF
        fi
        
        # Read Trivy summary
        if [ -f "trivy-summary.txt" ]; then
          source trivy-summary.txt
          echo "trivy-critical=${CRITICAL}" >> $GITHUB_OUTPUT
          echo "trivy-high=${HIGH}" >> $GITHUB_OUTPUT
          CRITICAL_COUNT=$((CRITICAL_COUNT + CRITICAL))
          HIGH_COUNT=$((HIGH_COUNT + HIGH))
        fi
        
        echo "critical-count=${CRITICAL_COUNT}" >> $GITHUB_OUTPUT
        echo "high-count=${HIGH_COUNT}" >> $GITHUB_OUTPUT
        
        # Determine if scan passed
        if [[ "${{ inputs.fail-on-critical }}" == "true" && ${CRITICAL_COUNT} -gt 0 ]]; then
          echo "scan-passed=false" >> $GITHUB_OUTPUT
        elif [[ ${HIGH_COUNT} -gt 5 ]]; then
          echo "scan-passed=false" >> $GITHUB_OUTPUT
        else
          echo "scan-passed=true" >> $GITHUB_OUTPUT
        fi

    - name: Generate security report
      id: report
      run: |
        cat > security-reports/security-summary.json << EOF
        {
          "solution": "${{ inputs.solution }}",
          "scan_type": "${{ inputs.scan-type }}",
          "critical_vulnerabilities": "${{ steps.results.outputs.critical-count }}",
          "high_vulnerabilities": "${{ steps.results.outputs.high-count }}",
          "scan_passed": "${{ steps.results.outputs.scan-passed }}",
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "commit": "${{ github.sha }}",
          "run_id": "${{ github.run_id }}"
        }
        EOF
        
        echo "location=security-reports/security-summary.json" >> $GITHUB_OUTPUT

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: ${{ inputs.solution }}-security-scan-${{ github.run_number }}
        path: |
          security-reports/
        retention-days: 30

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'security-reports/trivy-fs.sarif'

    - name: Security scan summary
      run: |
        echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Solution**: ${{ inputs.solution }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Scan Type**: ${{ inputs.scan-type }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Critical Vulnerabilities**: ${{ steps.results.outputs.critical-count }}" >> $GITHUB_STEP_SUMMARY
        echo "- **High Vulnerabilities**: ${{ steps.results.outputs.high-count }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Scan Passed**: ${{ steps.results.outputs.scan-passed }}" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ steps.results.outputs.scan-passed }}" == "false" ]]; then
          echo "### 🚨 Security Issues Found" >> $GITHUB_STEP_SUMMARY
          echo "The security scan found vulnerabilities that need to be addressed." >> $GITHUB_STEP_SUMMARY
        fi